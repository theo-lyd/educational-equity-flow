[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "educational-equity-flow"
version = "0.1.0"
description = "Educational equity and talent leakage analytics pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "educational-equity-flow" }]
dependencies = [
  "duckdb==1.1.3",
  "polars==1.9.0",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  "pyarrow==17.0.0",
  "dbt-duckdb==1.8.2",
  "great-expectations==0.18.21",
  "scikit-learn==1.5.2",
  "prophet==1.1.5",
  "streamlit==1.39.0"
]

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "pytest==8.3.3",
  "ruff==0.6.9"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Workbook contains no default style, apply openpyxl's default:UserWarning"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
