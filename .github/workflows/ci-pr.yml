name: ci-pr

on:
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: dbt slim parse/compile checks
        run: |
          cd dbt
          dbt deps --profiles-dir . || true
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .

      - name: Upload dbt parse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-pr-artifacts
          path: dbt/target/
          retention-days: 7
