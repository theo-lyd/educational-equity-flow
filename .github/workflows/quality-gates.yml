name: quality-gates

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DBT_THREADS: "1"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Seed CI bronze fixtures
        run: make ci-seed-bronze

      - name: Build dbt models
        run: make dbt-run

      - name: Run dbt tests
        run: make dbt-test

      - name: Run quality checks
        run: make quality-check

      - name: Run pytest suite
        run: make test

      - name: Upload quality and dbt artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quality-gates-artifacts
          path: |
            warehouse/artifacts/phase08_quality_report.json
            dbt/target/run_results.json
            dbt/target/manifest.json
          retention-days: 14
